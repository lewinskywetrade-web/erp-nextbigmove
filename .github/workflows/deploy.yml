name: Deploy

on:
  push:
    branches: [ "main", "fix/erp-positive-cogs" ]

jobs:
  deploy:
    environment: erp-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Inspect unattributed ad spend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "cd /opt/erp && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api node -" < scripts/inspect-unattributed-ad-spend.cjs

      - name: Deploy on droplet
        if: github.ref == 'refs/heads/main'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -e

          # Fetch transient network failures safely, then deploy exactly this workflow's commit.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/erp
            git rev-parse HEAD > /opt/erp/.prev_deploy_sha || true

            max_attempts=4
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Fetching main from GitHub (attempt $attempt/$max_attempts)..."
              if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 fetch --no-tags origin main; then
                break
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Unable to reach GitHub after $max_attempts attempts." >&2
                exit 1
              fi

              sleep $((attempt * 15))
            done

            git merge --ff-only "$DEPLOY_SHA"
          REMOTE

          # Write env file from secret
          echo "$PROD_ENV_FILE" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "cat > /opt/erp/.env.prod"

          # Copy env to api directory
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "cp /opt/erp/.env.prod /opt/erp/apps/api/.env.prod"

          # Build images sequentially to avoid OOM (exit code 137)
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "cd /opt/erp && \
            PREV_SHA=\$(cat /opt/erp/.prev_deploy_sha 2>/dev/null || echo '') && \
            docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml --env-file .env.prod build api && \
            if [ -z \"\$PREV_SHA\" ] || ! docker image inspect erp-web:latest >/dev/null 2>&1 || ! git diff --quiet \"\$PREV_SHA\" HEAD -- apps/web packages package.json package-lock.json; then \
              docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml --env-file .env.prod build web; \
            else \
              echo 'Skipping web build (no changes since previous deploy)'; \
            fi && \
            if [ -z \"\$PREV_SHA\" ] || ! docker image inspect erp-admin:latest >/dev/null 2>&1 || ! git diff --quiet \"\$PREV_SHA\" HEAD -- apps/admin packages package.json package-lock.json; then \
              docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml --env-file .env.prod build admin; \
            else \
              echo 'Skipping admin build (no changes since previous deploy)'; \
            fi && \
            if [ -z \"\$PREV_SHA\" ] || ! docker image inspect erp-whisper:latest >/dev/null 2>&1 || ! git diff --quiet \"\$PREV_SHA\" HEAD -- apps/whisper; then \
              docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml --env-file .env.prod build whisper; \
            else \
              echo 'Skipping whisper build (no changes since previous deploy)'; \
            fi"

          # Clean up old images BEFORE starting services to free memory
          ssh "$SSH_USER@$SSH_HOST" "docker image prune -f"

          # Start only redis first (needed for API)
          ssh "$SSH_USER@$SSH_HOST" "cd /opt/erp && \
            docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml --env-file .env.prod up -d redis"

          # Wait for redis to be healthy
          ssh "$SSH_USER@$SSH_HOST" "cd /opt/erp && \
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T redis redis-cli -a \$REDIS_PASSWORD ping || sleep 5"

          # Run migrations safely (auto-resolve failed migration state, then retry deploy)
          ssh "$SSH_USER@$SSH_HOST" "cd /opt/erp && ./scripts/prisma-migrate-deploy-safe.sh"

          # Run seed (uses compiled JS, idempotent - safe to run every deploy)
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "cd /opt/erp && \
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm -T api node apps/api/dist/prisma/seed.js"

          # Now start all services
          ssh "$SSH_USER@$SSH_HOST" "cd /opt/erp && \
            docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml --env-file .env.prod up -d"
