x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    container_name: erp-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp-network

  api:
    image: erp-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erp-api-prod
    environment: &api-environment
      NODE_ENV: production
      PROCESS_ROLE: ${API_PROCESS_ROLE:-api}
      LOG_DEBUG_ENABLED: ${LOG_DEBUG_ENABLED:-false}
      TZ: ${TZ}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECTION_LIMIT: ${API_DATABASE_CONNECTION_LIMIT:-6}
      DATABASE_POOL_TIMEOUT_SECONDS: ${API_DATABASE_POOL_TIMEOUT_SECONDS:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      ANALYTICS_MAX_CONCURRENT_PER_TENANT: ${ANALYTICS_MAX_CONCURRENT_PER_TENANT:-2}
      PANCAKE_WEBHOOK_PROCESSOR_CONCURRENCY: ${PANCAKE_WEBHOOK_PROCESSOR_CONCURRENCY:-2}
      PANCAKE_AUTO_CANCEL_PROCESSOR_CONCURRENCY: ${PANCAKE_AUTO_CANCEL_PROCESSOR_CONCURRENCY:-1}
      PANCAKE_REPORTS_HYDRATE_PROCESSOR_CONCURRENCY: ${PANCAKE_REPORTS_HYDRATE_PROCESSOR_CONCURRENCY:-1}
      PANCAKE_RECONCILE_PROCESSOR_CONCURRENCY: ${PANCAKE_RECONCILE_PROCESSOR_CONCURRENCY:-1}
      PANCAKE_WEBHOOK_RECONCILE_DELAY_MS: ${PANCAKE_WEBHOOK_RECONCILE_DELAY_MS:-10000}
      PANCAKE_WEBHOOK_RECONCILE_MIN_DELAY_MS: ${PANCAKE_WEBHOOK_RECONCILE_MIN_DELAY_MS:-10000}
      # Hard cap on how long an order update waits before its day rollup is
      # rebuilt (coalescing is bounded per tenant/day, so this can stay short).
      PANCAKE_WEBHOOK_RECONCILE_MAX_DELAY_MS: ${PANCAKE_WEBHOOK_RECONCILE_MAX_DELAY_MS:-10000}
      PANCAKE_WEBHOOK_ALLOW_AUTOMATIC_FULL_RESET: ${PANCAKE_WEBHOOK_ALLOW_AUTOMATIC_FULL_RESET:-false}
      POS_ORDER_RECOVERY_ENABLED: ${POS_ORDER_RECOVERY_ENABLED:-true}
      WMS_PACKING_POST_COMPLETE_QUEUE_CONCURRENCY: ${WMS_PACKING_POST_COMPLETE_QUEUE_CONCURRENCY:-2}
      WMS_PACKING_POST_COMPLETE_QUEUE_ATTEMPTS: ${WMS_PACKING_POST_COMPLETE_QUEUE_ATTEMPTS:-4}
      WMS_PACKING_POST_COMPLETE_QUEUE_BACKOFF_MS: ${WMS_PACKING_POST_COMPLETE_QUEUE_BACKOFF_MS:-3000}
      WMS_PACKING_POST_COMPLETE_QUEUE_TIMEOUT_MS: ${WMS_PACKING_POST_COMPLETE_QUEUE_TIMEOUT_MS:-60000}
      # Creative AI. The gateway (Claudex) runs on its own droplet and is
      # reached over the private VPC; these values point at it.
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      CLAUDEBOX_WS_URL: ${CLAUDEBOX_WS_URL}
      CLAUDEBOX_HTTP_URL: ${CLAUDEBOX_HTTP_URL}
      CLAUDEBOX_API_KEY: ${CLAUDEBOX_API_KEY:-}
      AI_AGENT_SIGNING_SECRET: ${AI_AGENT_SIGNING_SECRET:-}
      CREATIVE_AI_WORKSPACE_ROOT: /app/creative-ai
      CREATIVE_AI_UPLOAD_TMP_DIR: /app/creative-ai-uploads
      CREATIVE_AI_MAX_VIDEO_MB: ${CREATIVE_AI_MAX_VIDEO_MB:-250}
      CREATIVE_AI_MAX_VIDEO_SECONDS: ${CREATIVE_AI_MAX_VIDEO_SECONDS:-600}
      CREATIVE_AI_RUN_TIMEOUT_MS: ${CREATIVE_AI_RUN_TIMEOUT_MS:-600000}
      CREATIVE_AI_QUEUE_CONCURRENCY: ${CREATIVE_AI_QUEUE_CONCURRENCY:-1}
      CREATIVE_AI_QUEUE_ATTEMPTS: ${CREATIVE_AI_QUEUE_ATTEMPTS:-2}
      CREATIVE_AI_RETAIN_SOURCE_VIDEO: ${CREATIVE_AI_RETAIN_SOURCE_VIDEO:-false}
      CREATIVE_AI_WORKSPACE_RETENTION_DAYS: ${CREATIVE_AI_WORKSPACE_RETENTION_DAYS:-14}
      # Audio transcription runs in the whisper service below; the worker
      # posts the extracted audio to it. Leave the URL blank to run without.
      CREATIVE_AI_WHISPER_URL: ${CREATIVE_AI_WHISPER_URL:-http://whisper:3110}
      CREATIVE_AI_WHISPER_LANGUAGE: ${CREATIVE_AI_WHISPER_LANGUAGE:-}
      CREATIVE_AI_MAX_SCENES: ${CREATIVE_AI_MAX_SCENES:-40}
      CREATIVE_AI_MAX_GRID_FRAMES: ${CREATIVE_AI_MAX_GRID_FRAMES:-90}
      CREATIVE_AI_SCENE_THRESHOLD: ${CREATIVE_AI_SCENE_THRESHOLD:-0.3}
      CREATIVE_AI_PUSH_BUDGET_BYTES: ${CREATIVE_AI_PUSH_BUDGET_BYTES:-8000000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CORS_ORIGIN_WEB: ${CORS_ORIGIN_WEB}
      CORS_ORIGIN_ADMIN: ${CORS_ORIGIN_ADMIN}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET}
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: ${OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS}
      OBJECT_STORAGE_PAYMENT_PROOF_MAX_FILE_MB: ${OBJECT_STORAGE_PAYMENT_PROOF_MAX_FILE_MB}
      OBJECT_STORAGE_UNDELIVERABLE_PROOF_MAX_FILE_MB: ${OBJECT_STORAGE_UNDELIVERABLE_PROOF_MAX_FILE_MB:-30}
      OBJECT_STORAGE_PACKING_PROOF_MAX_FILE_MB: ${OBJECT_STORAGE_PACKING_PROOF_MAX_FILE_MB:-30}
      OBJECT_STORAGE_STOX_APK_MAX_FILE_MB: ${OBJECT_STORAGE_STOX_APK_MAX_FILE_MB}
      WMS_STOX_PACKING_PROOF_REQUIRED: ${WMS_STOX_PACKING_PROOF_REQUIRED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME}
    ports:
      - "3001:3001"
    volumes:
      - creative_ai_workspace:/app/creative-ai
      - creative_ai_uploads:/app/creative-ai-uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - erp-network

  worker:
    image: erp-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erp-worker-prod
    environment:
      <<: *api-environment
      PROCESS_ROLE: ${WORKER_PROCESS_ROLE:-worker}
      DATABASE_CONNECTION_LIMIT: ${WORKER_DATABASE_CONNECTION_LIMIT:-3}
      DATABASE_POOL_TIMEOUT_SECONDS: ${WORKER_DATABASE_POOL_TIMEOUT_SECONDS:-20}
    volumes:
      - creative_ai_workspace:/app/creative-ai
      - creative_ai_uploads:/app/creative-ai-uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - erp-network

  # Whisper transcription for creative analysis. Its own image because the
  # API runs on Alpine, where the Whisper runtimes cannot be installed. Only
  # the worker talks to it, over the private network. Memory-capped; the
  # model loads on first use and is released after ten idle minutes.
  whisper:
    image: erp-whisper
    build:
      context: .
      dockerfile: apps/whisper/Dockerfile
      args:
        WHISPER_MODEL: ${CREATIVE_AI_WHISPER_MODEL:-small}
    container_name: erp-whisper-prod
    environment:
      WHISPER_MODEL: ${CREATIVE_AI_WHISPER_MODEL:-small}
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
      WHISPER_IDLE_UNLOAD_SECONDS: ${WHISPER_IDLE_UNLOAD_SECONDS:-600}
    deploy:
      resources:
        limits:
          memory: ${WHISPER_MEMORY_LIMIT:-1536m}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - erp-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TIMEZONE: ${NEXT_PUBLIC_TIMEZONE}
        NEXT_PUBLIC_AI_AGENT_ENABLED: ${NEXT_PUBLIC_AI_AGENT_ENABLED:-false}
    container_name: erp-web-prod
    environment:
      TZ: ${TZ}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    networks:
      - erp-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL}
        NEXT_PUBLIC_TIMEZONE: ${NEXT_PUBLIC_TIMEZONE}
    container_name: erp-admin-prod
    environment:
      TZ: ${TZ}
    ports:
      - "3002:3002"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    networks:
      - erp-network

volumes:
  redis_data:
  # Creative AI: uploads land in creative_ai_uploads, prepared runs live in
  # creative_ai_workspace, shared by the api and the worker.
  creative_ai_workspace:
  creative_ai_uploads:

networks:
  erp-network:
    driver: bridge
